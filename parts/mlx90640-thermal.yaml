id: mlx90640-thermal
name: MLX90640 32x24 thermal camera array
manufacturer: Melexis
part_numbers:
- MLX90640ESF-BAB
- MLX90640ESF-BAA
- M5Stack Thermal2 U149
category: Thermal & optical
subcategory: 32x24 far-infrared thermopile array
bus:
- I2C
i2c:
  address: '0x33'
  configurable: true
  how_to_change: Address is stored in the sensor's internal EEPROM and can be rewritten, but almost nothing
    supports doing so. Treat it as fixed at 0x33.
protocol_settings: I2C at 400 kHz minimum. 100 kHz cannot sustain a 768-pixel frame at any useful rate.
voltage:
  min: 3.0
  max: 3.6
  nominal: 3.3
  logic: 3.3
price:
  band: $$$
  observed: 115.5
  source: listing
  currency: NZD
  observed_date: "2026-03-01"
  note: >-
    Vendor listing price for the packaged M5Stack thermal-camera unit. A bare MLX90640 breakout from a component distributor sits lower; the BAA (55 deg) and BAB (110 deg) variants also differ in price.
vendors:
- name: Digi-Key - Melexis MLX90640
  url: https://www.digikey.com/en/products/filter/optical-sensors/thermal-imaging
  part_number: MLX90640ESF-BAB
- name: M5Stack Thermal2 Unit
  url: https://shop.m5stack.com/products/thermal2-unit-mlx90640
  part_number: U149
- name: Adafruit MLX90640 breakout
  url: https://www.adafruit.com/product/4407
  part_number: '4407'
ip_rating: none
calibration_required: factory
calibration_notes: Factory-calibrated coefficients live in on-chip EEPROM; the driver reads them at boot.
  What you DO have to set is emissivity and reflected temperature. Green foliage is ~0.95. Leave emissivity
  at the default 1.0 and leaf temperature reads several degrees low, which will quietly corrupt every
  leaf-VPD number you calculate from it.
quality_tier: field-proven
deployment_count: 4
deployment_evidence:
- room-1-mlx90640.yaml
- room-1-r1-m-thermal-cam.yaml
- lite-5-mlx90640.yaml
- room-3-thermal-cam.yaml
evidence: 4 production configs run an active mlx90640 block - canopy leaf-temperature mapping in room 1 and
  Veg. Lower count than the CO2 fleet simply because you need one per room, not one per zone; it has been
  continuously deployed rather than trialled.
failure_modes:
- Default emissivity 1.0 under-reads leaf temperature by 2-4 C. Set 0.95 for foliage or every leaf-VPD
  figure downstream is wrong.
- At 100 kHz I2C the frame read is too slow and you get torn or dropped frames - 400 kHz is mandatory.
- The array self-heats; ta_shift exists to correct reflected temperature and the default (8 K, FLIR convention)
  is not always right for a sealed room.
- A single hot LED driver in frame drags a whole-frame average badly - use a region of interest over the
  canopy, not the frame mean.
- 0x33 is fixed in practice, so two cameras need two buses or a mux.
notes: Use a region of interest centred on the canopy rather than the frame average - the fleet configs
  use an 11x11 px ROI out of the 24x32 array and keep per-frame min/max as separate canopy diagnostics.
  Leaf temperature from this feeds leaf-VPD, which is a far better steering signal than air VPD alone.
drivers:
- name: stackdrift esphome-components (mlx90640)
  url: https://codeberg.org/stackdrift/esphome-components
  kind: esphome-external
- name: Melexis MLX90640 datasheet
  url: https://www.melexis.com/en/product/MLX90640/Far-Infrared-Thermal-Sensor-Array
  kind: datasheet
platforms:
- ESPHome
