evidence: |-
  Two deployments, both on boards where the Ethernet is an SPI add-on rather than a native PHY. Works, but the native-PHY PoE route is the one that scaled to 48 nodes here.
failure_modes:
  - Uses 5 GPIO (clk/mosi/miso/cs/int) plus reset. On a crowded board that is most of your free pins.
  - SPI Ethernet is slower and more CPU-hungry than a native RMII PHY - noticeable if the node also drives a display.
  - Cheap clones ship with a duplicate or blank MAC; set one explicitly if you run more than one.
