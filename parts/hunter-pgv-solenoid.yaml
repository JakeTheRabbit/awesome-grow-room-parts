evidence: The zone valve behind the relay nodes in this fleet - six configs drive 24 VAC valves through
  relay boards. Bought repeatedly at the same trade price across separate purchase lines, which is a fair
  sign it is the settled choice rather than a trial.
failure_modes:
- Grit under the diaphragm holds the valve part-open and it weeps continuously - fit a screen filter upstream,
  which is cheaper than the callout.
- The solenoid can be unscrewed under pressure by accident during manual bleeding, which dumps the line.
- 24 VAC coils hum audibly; in a quiet room that reads as a fault when it is normal.
- Fails OPEN if the diaphragm perforates - the software safety pattern cannot save you here, so put a
  master valve or a normally-closed contactor upstream.
notes: Pair with a 24 VAC transformer sized for simultaneous zones (see transformer-24vac). Inrush is
  roughly 3x hold current, so a transformer that runs three valves steady-state may still brown out when
  they all pull in together - stagger the switch-on. Everything driving one of these must carry the flood-safety
  pattern in SAFETY.md.
