evidence: HALL OF SHAME. A full custom ESPHome component for this part exists in the fleet (common/sensors/leapmmw_sensor.yaml
  plus a 4.7 KB leapmmw_sensor.h), and ZERO of the 149 device configs include it. Someone did the integration
  work and then never deployed it - that is a louder verdict than any spec sheet.
failure_modes:
- Written and debugged, then abandoned before a single production deployment - the component is dead code.
- 24 GHz radar sees through thin walls and plastic, so it detects people in the NEXT room. In a compartmented
  facility that means constant phantom occupancy.
- Oscillating fans and swaying plant canopy both register as motion - a grow room is close to the worst-case
  environment for this sensor.
- Proprietary binary framing with sparse documentation; the custom component exists precisely because
  no core ESPHome driver covers it.
notes: Not a bad chip, but a bad fit for a room full of moving leaves and fans. If you want presence in
  a grow space, a PIR outside the canopy or door contacts plus RFID will lie to you far less. Listed here
  so nobody else spends a weekend on the same integration.
