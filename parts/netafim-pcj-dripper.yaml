evidence: The emitter behind every substrate-sensing zone in this fleet - the VWC and pore-water EC numbers
  those probes report are only meaningful because delivery per plant is even, which is exactly what pressure
  compensation buys.
failure_modes:
- Non-compensating drippers on a long run deliver more at the near end - the resulting VWC spread reads
  as sensor disagreement when it is actually a plumbing problem.
- The CNL (anti-drain) variants stop siphoning between shots; without them the line drains after every
  irrigation and the first part of the next shot is air.
- Root intrusion into the outlet on media that stays saturated.
- Spikes pull out of coir under their own tube weight if the tube is not clipped - the emitter then waters
  the floor and the block dries out unnoticed.
notes: 'Pressure compensation is the whole point: without it, per-plant delivery varies along the line
  and every substrate reading you take is comparing plants that got different amounts of water. If you
  are steering a crop on VWC, this is not the place to save money. Pair the anti-drain (CNL) version with
  the line flush valve.'
