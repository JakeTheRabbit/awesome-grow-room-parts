- room-3-solenoid-relays.yaml
evidence: Two on zone feeds, downstream of the main reducer. Fixed-outlet regulators per zone are the
  cheap way to stop one zone's pressure moving when another opens.
failure_modes:
- Below its minimum flow it does not regulate at all and simply passes inlet pressure - a small zone on
  a big regulator is a silent failure.
- 'Fixed outlet means no adjustment: buy the right psi for your emitters or buy a different one.'
- Directional - fitting it backwards does nothing and looks fine.
notes: Per-zone regulation on top of a single main reducer keeps zones independent, so opening a second
  zone does not change delivery in the first. Cheap enough to fit per zone and worth it if you irrigate
  zones simultaneously.
