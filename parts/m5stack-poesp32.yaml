image: assets/parts/m5stack-poesp32.svg
example:
  lang: yaml
  title: IP101 Ethernet - the exact pin map used on all 48 nodes
  source: distilled from room-1-irrigation-relays.yaml
  code: |
    ethernet:
      type: IP101
      mdc_pin: GPIO23
      mdio_pin: GPIO18
      clk_mode: GPIO0_IN
      phy_addr: 1
      power_pin: GPIO5
      # Do NOT de-energise outputs directly here - brief flaps are normal.
      # Start a grace timer instead, and cancel it if the link comes back.
      on_connect:
        - script.stop: disconnect_killguard
      on_disconnect:
        - script.execute: disconnect_killguard

    text_sensor:
      - platform: ethernet_info
        ip_address:
          name: IP
        mac_address:
          name: MAC
