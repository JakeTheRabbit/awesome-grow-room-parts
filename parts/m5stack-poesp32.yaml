evidence: '48 of 149 production configs declare `ethernet: type: IP101` with the M5Stack pin map (mdc
  GPIO23, mdio GPIO18, clk GPIO0_IN, power GPIO5). Every load-bearing actuator in the facility - irrigation
  valves, CO2, dehumidifiers, lighting contactors - runs wired rather than WiFi, and that is a deliberate
  reliability decision.'
failure_modes:
- Short Ethernet flaps are common on cheap unmanaged switches; if you kill outputs instantly on on_disconnect
  you WILL interrupt live feeds. Use a grace timer - see the SAFETY.md killguard pattern.
- power_pin GPIO5 must be driven or the PHY never comes up - symptom is a device that boots and reboots
  with no link.
- PoE injectors that are not 802.3af-compliant (passive 24V) will not power it and can damage the unit.
- GPIO0 is the PHY clock input, so it is unavailable for anything else and affects boot strapping.
notes: This is the backbone of the facility. Wired Ethernet removes the entire class of 'WiFi dropped
  and the valve stayed open' failures. The IP101G pin map below is identical in all 48 configs - copy
  it verbatim. Note the newer M5Stack PoE modules ship a W5500 SPI MAC instead of the IP101 RMII PHY;
  the ESPHome config is different (see w5500-ethernet).
drivers:
