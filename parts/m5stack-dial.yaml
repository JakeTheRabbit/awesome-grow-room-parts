  - m5-dial-scales2.yaml
  - sdi-12-m5dial.yaml
  - m5-dial-3.yaml
  - aquaponics-kit.yaml
evidence: |-
  Used as the at-the-tank readout: CO2 cylinder scales, batch tank level and a bench SDI-12 probe tester. Being able to read a number without opening a laptop is worth more in a wet room than it sounds.
failure_modes:
  - Its internal I2C is GPIO11/GPIO12 and already carries three devices. Hanging external sensors off the same bus causes address clashes with anything at 0x28, 0x38 or 0x51.
  - The screen is the power hog - on battery it is hours, not days. Treat it as a mains device.
  - Rotary encoder detents are read in software; a busy display refresh can drop steps.
