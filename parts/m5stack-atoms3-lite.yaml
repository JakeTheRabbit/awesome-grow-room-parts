evidence: Widely used for newer nodes. Native USB makes flashing painless and the S3 has the RAM headroom the ESP32 classic runs out of on thermal-camera and voice work.
failure_modes:
  - Native USB CDC means the serial port disappears on reboot - set a longer upload timeout or use OTA.
  - S3 pin numbering differs from the classic ATOM. Copy-pasting an ATOM Lite config will silently target the wrong pins.
