deployment_count: 1
deployment_evidence:
- kincony-f16-node.yaml
evidence: HALL OF SHAME (with an asterisk). Exactly one config, and that config STILL CONTAINS a brute-force
  Modbus address scanner - it walks slave addresses looking for the board because the address was never
  pinned down. A config that is still probing for its own device is not a config you should copy.
failure_modes:
- The live config carries a leftover brute-force address scanner - the Modbus slave address was never
  determined and committed.
- 'Sixteen channels on one node is a large blast radius: one failed board takes out sixteen loads at once.'
- Documentation is thin and largely machine-translated; pinouts differ between hardware revisions sold
  under the same name.
- Its W5500 Ethernet needs a different ESPHome config from the IP101 PHY used everywhere else in this
  fleet - an easy way to lose an afternoon.
notes: Attractive on price-per-channel and it is genuinely DIN-rail mountable, which the M5Stack units
  are not. But concentrate irrigation on one 16-channel board and a single failure floods everything.
  This fleet deliberately uses several 4-channel nodes instead. If you do deploy it, pin the Modbus address
  and delete the scanner.
drivers:
- name: KinCony ESPHome docs
  url: https://www.kincony.com/esphome-support.html
  kind: manual
platforms:
