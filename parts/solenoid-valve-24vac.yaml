evidence: |-
  Three zones in room 1 plus four in veg, on 1.5 minute shots. Standard irrigation hardware doing standard irrigation work - the interesting part is entirely in how you fail them safe.
failure_modes:
  - A valve stuck open is a flooded room. This is the single highest-consequence failure in the whole catalogue - restore_mode ALWAYS_OFF plus an auto-shutoff delay is not optional.
  - Grit in the diaphragm holds it partly open. Fit a 130 micron filter upstream and clean it.
  - Inductive kickback from the coil kills cheap relays. Use a properly rated relay module or fit a snubber.
  - Solenoid coils buzz and get warm in normal operation - that is not a fault, but a coil that gets hot enough to smell is.
  - Low pressure means the diaphragm may not seat. Most valves need a minimum pressure to close reliably.
notes: See SAFETY.md. Every valve in this facility carries restore_mode ALWAYS_OFF plus a 5 minute hard auto-shutoff.
