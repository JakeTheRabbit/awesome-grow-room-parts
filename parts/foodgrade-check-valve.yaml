evidence: On the dosing lines out of the peristaltic heads. Cheap protection against the failure where
  a stock concentrate siphons back into a shared line.
failure_modes:
- Fitted backwards it silently blocks the dose - the pump runs, reports success, and nothing arrives.
- Cracking pressure is not zero; a very low-flow peristaltic head may struggle to open it, so check the
  head can actually shift it.
- Non-food-grade equivalents leach into nutrient concentrate and perish in acid.
notes: The reason to fit one is not the pump - it is the shared manifold. Without a check valve per dosing
  line, concentrated pH-down can migrate up another pump's line into a different stock container, which
  ruins the stock and is genuinely hazardous to handle.
