evidence: HALL OF SHAME. A 3.8 KB common/sensors/zphs01b.yaml block exists and is referenced from the
  AirQ sensor library, yet no device config actually instantiates it. Worse, the lambdas in that block
  return an empty optional `{}` on the paths that matter, so even if you did include it, several channels
  would publish nothing at all.
failure_modes:
- The shipped lambdas return `{}` (no value) rather than a reading - the integration was never finished.
- Bundling seven sensors behind one UART means one dead channel and you are replacing the whole 180 NZD
  module.
- The electrochemical O3/CO/NO2 cells have a 2-3 year service life and drift badly; they are not calibratable
  in the field.
- Its CO2 channel is a cheap NDIR that a single SCD41 comfortably beats for a third of the price.
notes: The all-in-one temptation. In practice a SEN55 for particulates/VOC plus an SCD41 for CO2 costs
  about the same, is properly supported in ESPHome core, and lets you replace one sensor without binning
  the other. Buy the two discrete parts.
