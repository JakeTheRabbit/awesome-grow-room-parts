evidence: Plain GPIO-driven SSRs carry the highest-current loads in the facility - CO2 solenoids, the
  main pump, lighting contactors and vent actuators. 8 configs switch one directly from a GPIO pin with
  the standard safety pattern attached.
failure_modes:
- 'Clone SSRs are routinely over-rated: a ''25A'' clone will cook at 10A without a substantial heatsink.
  Derate to about 40 percent of the badge and bolt it to metal.'
- SSRs fail SHORT (permanently on) far more often than open. On anything that can flood or overheat a
  room, put a mechanical contactor or an RCD downstream as the real safety layer.
- Zero-cross types will not dim or chop a phase - do not try to use one for lighting control, use a proper
  0-10V or PWM driver.
- Small leakage current when off can keep neon indicators and some LED drivers faintly lit.
notes: 'The correct pairing is: SSR switches a contactor, contactor switches the load. Driving a large
  inductive load straight off an SSR is how you get a welded-on output. Every SSR controlling water or
  CO2 in this fleet carries restore_mode ALWAYS_OFF plus an auto-shutoff delay - see SAFETY.md.'
drivers:
- name: ESPHome gpio switch
  url: https://esphome.io/components/switch/gpio.html
  kind: esphome-core
platforms:
