image: assets/parts/tca9548a-mux.svg
example:
  lang: yaml
  title: Two SCD4x on one bus via a mux (moved off 0x70)
  source: distilled from espoe-multiplexer-irrigation-relays.yaml
  code: |
    i2c:
      id: bus_a
      sda: GPIO16
      scl: GPIO17
      scan: true

    # Mux moved to 0x71: 0x70 is the QMP6988 default in the M5Stack ENV.III,
    # and having both on one bus is the classic self-inflicted collision.
    tca9548a:
      - address: 0x71
        i2c_id: bus_a
        id: multiplex
        channels:
          - bus_id: mux_ch0
          - bus_id: mux_ch1

    sensor:
      # Both SCD4x are hard-wired to 0x62 - the mux is what makes this legal.
      - platform: scd4x
        i2c_id: mux_ch0
        address: 0x62
        co2: { name: "CO2 canopy" }

      - platform: scd4x
        i2c_id: mux_ch1
        address: 0x62
        co2: { name: "CO2 floor" }
