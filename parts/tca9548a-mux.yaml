id: tca9548a-mux
name: TCA9548A 8-channel I2C multiplexer
manufacturer: Texas Instruments
part_numbers:
- TCA9548A
- PCA9548A
- TCA9548APWR
category: Bus infrastructure
subcategory: 1-to-8 I2C switch
bus:
- I2C
i2c:
  address: '0x70'
  alternates:
  - '0x71'
  - '0x72'
  - '0x73'
  - '0x74'
  - '0x75'
  - '0x76'
  - '0x77'
  configurable: true
  how_to_change: Three address pins A0/A1/A2 select 0x70-0x77, so eight muxes can share one bus for 64
