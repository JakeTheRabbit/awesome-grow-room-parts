evidence: '9 production configs run a TCA9548A. It exists in this fleet for exactly one reason: fixed-address
  parts. Two SCD4x (both 0x62) or an ENV.III QMP6988 next to a mux (both 0x70) cannot share a bus without
  one.'
failure_modes:
- Its own default 0x70 collides with the QMP6988 in the M5Stack ENV.III - the most common self-inflicted
  collision in this catalogue. Move the mux to 0x71.
- Forgetting to disable a channel leaves two channels open at once and you get corrupted reads that look
  like a flaky sensor.
- Adds a round-trip per channel switch, so polling many sensors fast gets slow.
- It does not isolate a shorted or latched-up device - one dead sensor pulling SDA low still kills its
  channel.
notes: The single fix for an address collision. Before you buy one, check the collision map page - sometimes
  the cheaper answer is a second I2C bus on spare GPIO pins, which ESP32 supports natively and costs nothing.
