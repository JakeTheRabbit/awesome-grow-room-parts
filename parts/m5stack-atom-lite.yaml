evidence: |-
  Carries the entire SDI-12 substrate fleet - one ATOM per probe, 14 units. Cheap enough to put one at every probe rather than run long analogue cable back to a central board.
failure_modes:
  - WiFi-only. Fine for a sensor that can miss a reading; never put an irrigation valve on one.
  - The single onboard button is GPIO39 and is input-only - no internal pullup on some revisions.
  - USB-C power means a wall wart per probe. In a wet room that is a lot of GFCI-adjacent plugs; PoE is tidier at scale.
  - Onboard RGB LED shares GPIO27; driving it from esp32_rmt_led_strip while doing tight UART timing can jitter SDI-12 reads.
notes: For SDI-12 the ATOM is wired single-pin half-duplex on GPIO26 - see the meter-teros12 and infiwin-mt22 entries for the exact UART block.
