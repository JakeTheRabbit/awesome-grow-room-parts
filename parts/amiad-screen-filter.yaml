evidence: Fitted upstream of every dripline zone in this fleet. Counted against the zone-valve nodes it
  protects; like the transformer it is plumbing rather than a configured device, so it does not appear
  in any YAML.
failure_modes:
- Left unflushed it blocks, pressure drops, and the far end of the dripline silently under-waters - the
  plants tell you before any sensor does.
- 130 micron passes fine silt that will still clog PCJ drippers over a season; go to 120 mesh / 100 micron
  if your source water is dirty.
- The plastic body will crack if over-tightened onto a rigid PVC riser - use a union.
- No differential-pressure indicator on the compact models, so blockage is invisible until flow drops.
notes: The cheapest insurance in the whole irrigation stack. A NZ$49 filter protects a few hundred dollars
  of drippers and, more importantly, stops the uneven watering that partial blockage causes - which is
  far harder to diagnose than an outright failure. Fit it upstream of the solenoids, not downstream.
