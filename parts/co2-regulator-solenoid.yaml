evidence: HAGR identifies this regulator and solenoid set as the unit in use. The current vendor listing confirms a 0-15 SCFH flowmeter, 0-4000 psi high-pressure gauge, 230 V solenoid, 4.2 mm hose tail and NZ hire-cylinder coupling. The regulator is not represented in ESPHome, so it is rated works rather than field-proven.
failure_modes:
- A solenoid stuck open can displace oxygen in an enclosed room. Use an independent CO2 alarm, occupancy and ventilation interlocks, and a short device-level dead-man timer. Home Assistant alone is not a life-safety controller.
- Cylinder pressure does not report remaining liquid CO2 reliably; pressure stays nearly flat until the liquid is gone. Weigh the cylinder if remaining capacity matters.
- Cylinder valve threads vary by country and gas supplier. Confirm the coupling matches the actual cylinder before ordering.
- The listing gives no ingress rating for the solenoid. Keep the mains assembly dry and outside spray or condensation paths.
- High sustained flow can chill or ice the regulator and change delivered flow. Size tubing and injection bursts rather than leaving the valve continuously energised.
notes: The safe automation pattern is deliberately fail-closed. Restore outputs off after reboot, de-energise on network loss, cap every injection burst locally, and treat the room CO2 alarm as independent hardware. The flowmeter sets an approximate delivery rate; the SCD41 closes the control loop on measured room concentration.
