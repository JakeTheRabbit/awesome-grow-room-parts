- atlas-reservoir.yaml
evidence: The consumable inside every dosing head in this fleet. Specified for chemical dispensing rather
  than generic silicone, which matters because concentrated nutrient and pH adjusters destroy the wrong
  polymer.
failure_modes:
- THE wear item in any peristaltic doser. It flattens where the rollers run and delivered volume drifts
  DOWN silently - your EC creeps off target and the pump reports success throughout.
- Concentrated pH-down (nitric or phosphoric) embrittles cheap silicone in weeks; A-60-G is specified
  for it, generic tubing is not.
- Replacing it changes the calibration, so a tube swap without re-calibration is itself a dosing error.
- Sized bore only - the wrong ID either will not seat in the rollers or slips and pumps nothing.
notes: Budget this as a scheduled consumable, not a spare part. Put a recurring reminder against it and
  re-calibrate on replacement. The failure mode that hurts is not a burst tube, which is obvious - it
  is the slow decline in delivered volume, which looks exactly like your nutrient recipe being wrong.
