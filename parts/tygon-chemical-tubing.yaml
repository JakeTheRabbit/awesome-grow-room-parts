calibration_notes: Peristaltic dose volume is a function of TUBING condition, not just pump steps. Re-calibrate
  mL-per-revolution after fitting new tube and again once it has bedded in, or every dose you have ever
  calibrated is wrong.
quality_tier: field-proven
