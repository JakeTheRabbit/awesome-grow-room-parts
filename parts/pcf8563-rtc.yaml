evidence: '13 configs declare an active `time: - platform: pcf8563` at 0x51, mostly the AirQ and M5 Dial
  units where it comes on the board. It matters because a node that loses network still needs correct
  local time to run a lighting or irrigation schedule.'
failure_modes:
- Dead or missing backup cell and it silently resets to 2000-01-01 on every power cut - schedules then
  fire at the wrong time rather than not at all, which is worse.
- Cheap modules ship with the backup-charging resistor fitted for a rechargeable LIR2032; put a non-rechargeable
  CR2032 in one of those and it will leak or vent.
- Drifts a few seconds a day without periodic sync - pair it with SNTP and let the network correct it
  when available.
notes: Cheap insurance for any node that runs a schedule. Configure SNTP as the primary time source and
  the PCF8563 as the fallback, so the node keeps sane time through a network outage and re-syncs when
  the network returns.
drivers:
- name: ESPHome pcf8563 time
  url: https://esphome.io/components/time/pcf8563.html
  kind: esphome-core
- name: NXP PCF8563 datasheet
