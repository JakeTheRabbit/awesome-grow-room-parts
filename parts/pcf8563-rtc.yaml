image: assets/parts/pcf8563-rtc.svg
example:
  lang: yaml
  title: RTC as fallback, SNTP as primary
  source: distilled from air-q-entry.yaml
  code: |
    i2c:
      id: bus_a
      sda: GPIO16
      scl: GPIO17

    time:
      # Primary: network time whenever the node can reach it.
      - platform: sntp
        id: sntp_time
        servers:
          - 0.pool.ntp.org
          - 1.pool.ntp.org
        on_time_sync:
          then:
            # Push the good time back into the RTC so the coin cell holds it.
            - pcf8563.write_time:
                id: rtc_time

      # Fallback: keeps schedules honest through a network outage.
      - platform: pcf8563
        id: rtc_time
        i2c_id: bus_a
        address: 0x51
        update_interval: never
tags:
