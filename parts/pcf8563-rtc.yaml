category: Bus infrastructure
subcategory: I2C real-time clock with battery backup
bus:
- I2C
i2c:
  address: '0x51'
  configurable: false
  how_to_change: Fixed at 0x51. Rarely a problem - little else uses that address.
voltage:
  min: 1.0
  max: 5.5
  nominal: 3.3
  note: Runs down to 1.0V on backup current, so a coin cell holds time for years.
