evidence: |-
  Custom STM32 firmware for a purpose-built multi-channel batch doser, held locally as a source tree. Not currently the production doser here (that is the ESPHome peristaltic node) but it is the more capable design - deterministic timing on a microcontroller instead of a WiFi/PoE stack with a 5 minute reboot timeout.
failure_modes:
  - Custom firmware means you own the bugs. There is no ESPHome community to fall back on.
  - Anything driving dosing pumps needs the same de-energise-on-comms-loss guarantee an ESPHome node gets from on_disconnect. Verify the firmware has an equivalent before trusting it.
notes: |-
  Documented here for completeness because it is part of the local hardware estate. If you are building from scratch, the ESPHome peristaltic node is the lower-risk starting point.
