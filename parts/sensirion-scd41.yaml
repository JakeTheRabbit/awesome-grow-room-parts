id: sensirion-scd41
name: Sensirion SCD41 true NDIR CO2 sensor
manufacturer: Sensirion
part_numbers:
  - SCD41
  - SCD41-D-R2
  - M5Stack U103 (CO2L Unit)
category: Air quality & CO2
subcategory: CO2 / temperature / humidity
bus:
