  observed_date: "2026-03-01"
  note: >-
    Vendor listing price for the M5Stack CO2L Grove unit (the packaged form most people buy). A bare Sensirion SCD41 module from a component distributor is cheaper but needs your own cabling and enclosure.
vendors:
