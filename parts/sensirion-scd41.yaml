  - Grove
i2c:
  address: "0x62"
  configurable: false
  how_to_change: Not configurable. Two SCD4x on one bus requires a TCA9548A mux - this is the single most common bus collision in a grow room.
protocol_settings: I2C up to 100kHz. Sensirion recommend 50kHz when the Grove cable is long.
voltage:
  nominal: 3.3
  min: 2.4
  max: 5.5
  logic: 3.3
  note: M5Stack Grove unit accepts 5V and regulates onboard.
