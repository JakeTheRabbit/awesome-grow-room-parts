ip_rating: none
calibration_required: periodic
calibration_notes: |-
  Ships factory-calibrated. In a CO2-enriched room automatic self-calibration (ASC) MUST be off - ASC assumes the sensor sees 400ppm fresh air regularly, which never happens in a sealed flower room, so it will slowly recalibrate your 1500ppm setpoint down to nonsense. Do a forced recalibration in outdoor air roughly annually instead. Set altitude_compensation to your site elevation.
quality_tier: field-proven
deployment_count: 29
deployment_evidence:
  - room-2-scd41-env3-dlight-poe.yaml
  - room-3-scd41-top.yaml
  - dry-room-scd41-enviii.yaml
  - dry-room-scd41-enviii-atom.yaml
  - co2-node-2.yaml
  - echo-1.yaml
  - air-q-entry.yaml
  - air-q-dry-room.yaml
  - airq-aux-1.yaml
  - airq-annex.yaml
evidence: |-
  29 active deployments - the most-used sensor in the catalogue after the PoE board itself. It is the sensor the CO2 injection control loop actually runs on in room 1, room 2, veg and the drying room.
failure_modes:
  - Single fixed address 0x62. Two in one room means a TCA9548A mux or two boards - plan for it before you buy the second one.
  - Leave ASC enabled in a sealed CO2-enriched room and it will drift your control setpoint down over weeks. This is the failure that bites people.
  - "Self-heats. Every deployment here marks its temperature and humidity channels internal: true and reads climate off a separate SHT30."
  - Above roughly 2000ppm accuracy degrades; the deployed filter clamps to 300-2500ppm and drops anything outside as a bad read.
  - Condensation kills it. In a drying room or a room that hits dewpoint, keep it off cold surfaces.
notes: |-
  The clamp-and-drop lambda below is used on all 29 deployments. Returning `{}` from an ESPHome filter lambda discards the reading entirely rather than publishing a spike - which is what you want feeding a solenoid that injects CO2.
drivers:
  - name: ESPHome scd4x
    url: https://esphome.io/components/sensor/scd4x.html
    kind: esphome-core
