deployment_evidence: []
evidence: Not currently deployed - this fleet standardised on the 4-channel unit. Catalogued because two
  channels is often the honest requirement, and a smaller module means a smaller blast radius when it
  fails.
failure_modes:
- Same welded-contact risk as any relay driving an inductive load - fit a snubber or drive a contactor.
- Default 0x25 is one address away from the 4-Relay's 0x26; mixing them without checking is an easy collision.
- Restores its previous state on boot unless told otherwise - force restore_mode ALWAYS_OFF on anything
  that moves water or gas.
notes: 'Everything in SAFETY.md applies here exactly as it does to the 4-channel unit. Fewer channels
  is a feature for anything critical: one failed module takes out two loads rather than four.'
