    Receipt price for a 24V 600 mL/min stepper-driven head bought direct from the manufacturer. Branded lab pumps of the same spec run several times this.
vendors:
  - name: Kamoer
    url: https://www.kamoer.com/products/peristaltic-pumps
    region: Global
