    url: https://www.aliexpress.com/w/wholesale-12V-peristaltic-dosing-pump.html
    region: Global
ip_rating: none
calibration_required: periodic
calibration_notes: |-
  Calibrate by running the pump for a fixed time into a measuring cylinder and storing mL/s as a persistent global. Recalibrate when you change tubing - the tube IS the pump, and it work-hardens and loses volume per revolution as it ages. The deployed config stores a per-pump flow_rate global with restore_value: yes and exposes a calibration routine as a button.
quality_tier: field-proven
deployment_count: 4
deployment_evidence:
  - espoe-peristaltic-pumps.yaml
evidence: |-
  Four heads dosing a 200L batch tank from 50L stock tanks, in continuous production service. This is also the node the whole SAFETY pattern was hardened around - a doser that keeps running after the network drops is how you dump 50L of Core into a batch tank.
failure_modes:
  - Tubing is a consumable. It thins, output drops silently, and your EC target quietly stops being met. Replace on a schedule, not on failure.
  - A stuck-on doser is the worst failure in the room. restore_mode ALWAYS_OFF plus a hard auto-shutoff delay plus ethernet on_disconnect are all mandatory - see SAFETY.md.
  - Dry running wrecks the head. Interlock against tank level if you can.
  - Back-siphoning from the batch tank into a stock tank if the head is mounted below liquid level. Mount above, or fit a check valve.
  - Cross-contamination between concentrated A and B parts causes precipitation in shared lines. Separate lines, always.
notes: See SAFETY.md - this part is the reason that document exists.
