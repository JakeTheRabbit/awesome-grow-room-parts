evidence: "Paired with the HX711 on all four scale nodes. Size the cell to the load: a full 25kg CO2 cylinder on a 200kg bar wastes most of your resolution."
failure_modes:
  - Overload past the rated capacity permanently deforms the gauge. There is no recovery and no error - it just reads wrong forever.
  - Half-bridge 50kg cells (the flat bathroom-scale type) need to be used in fours, or with a matching dummy resistor pair. Used singly they are wildly nonlinear.
  - Moisture ingress at the cable entry drifts the bridge. In a wet room, seal it.
