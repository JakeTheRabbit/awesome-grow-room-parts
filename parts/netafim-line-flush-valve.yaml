evidence: Fitted at the end of dripline runs. Opens at low pressure at the start of each irrigation and
  closes as the line comes up to pressure, so the line self-purges.
failure_modes:
- Discharges to wherever you point it - into a tray or drain, not onto the floor or into the electrics.
- Fails open in grit and then bleeds continuously, which shows up as a zone that never reaches pressure.
- Adds a small volume to every shot; if you are dosing precisely, account for it.
notes: 'Solves the problem where sediment collects at the dead end of a lateral and gradually migrates
  back into the last few emitters. Pairs naturally with the screen filter: the filter stops most of it
  arriving, this clears whatever still does.'
