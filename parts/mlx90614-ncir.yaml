ip_rating: none
calibration_required: factory
calibration_notes: Factory-calibrated, but like any IR sensor it reports a temperature that assumes an
  emissivity. Green foliage is about 0.95, not the 1.0 most libraries default to - leave it at 1.0 and
  leaf temperature reads low.
quality_tier: works
deployment_count: 0
deployment_evidence: []
evidence: No active config in the current fleet - canopy temperature here is measured with the MLX90640
  array instead. Catalogued because it is by far the cheapest route to a leaf-temperature signal, and
  leaf VPD beats air VPD as a steering input.
failure_modes:
- Field of view is a CONE, roughly 35 degrees on the BAA. Mount it too far back and you are averaging
  leaf, pot, floor and lamp into one number.
- Reads the first opaque surface it sees - a leaf that moves out of frame silently changes what you are
  measuring.
- Emissivity left at 1.0 under-reads foliage by several degrees, which quietly corrupts any leaf-VPD calculation
  downstream.
- Sensitive to its own ambient temperature; mounting it near a driver or in the lamp's radiant path biases
  it.
notes: One spot versus the MLX90640's 768 - much cheaper, and adequate if you only need a single representative
  canopy point. Mount it close enough that the cone sees leaf and nothing else, and set emissivity to
  0.95 before believing any number it gives you.
