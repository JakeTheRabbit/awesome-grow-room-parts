evidence: HAGR identifies the KP303 as the smart strip in use. TP-Link documents three independently controlled outlets, two always-on USB ports, 2.4 GHz WiFi and a 10 A / 2400 W total rating for the AU version. Home Assistant's official TP-Link integration explicitly lists KP303 power-strip support and uses local polling.
failure_modes:
- Indoor-only and not moisture rated. Do not mount it in spray, runoff, floor-level flood or heavy-condensation zones.
- The current limit is shared across all three outlets. Three individually controlled sockets do not provide three times the strip's total rating.
- Relays can weld closed under motors, compressors, heaters and other high-inrush loads. Use the strip for modest loads or contactor coils, not as the final safety disconnect for critical equipment.
- The two USB ports are always energised and cannot be switched individually.
- Newer firmware may require TP-Link account credentials for local authentication. Provision and verify Home Assistant control before depending on an automation.
notes: Useful for lamps, small fans and humidifiers where three independent Home Assistant switch entities are convenient. It is not a wet-location power distribution unit, a motor contactor, or an emergency cutoff.
