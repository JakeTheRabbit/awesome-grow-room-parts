calibration_required: two-point
calibration_notes: |-
  Zero it with the probe dry/at the tank floor, then span it at a known fill depth. The register scaling is range-dependent, so a config copied from a different range unit will be wrong by a constant factor - check against a tape measure before you trust it.
quality_tier: experimental
deployment_count: 0
evidence: |-
  Not deployed. Included as part of the under-documented ComWinTop RS485 rescue: the family conventions in the notes are confirmed from the CWT-LEAF-TH work, the model-specific register map is NOT confirmed and the original vendor manual only ever existed as an email attachment. Treat register addresses as a starting point, not gospel.
failure_modes:
  - Submersible pressure sensing measures head, so a nutrient solution reads slightly different from plain water. Calibrate in the actual solution.
  - Vent tube blockage on gauge-referenced units makes the reading track barometric pressure instead of level.
  - Same undocumented-register risk as the whole CWT range - verify every address against your own unit.
notes: |-
  ComWinTop (CWT) sell a whole family of cheap industrial RS485 Modbus sensors that are barely documented in English anywhere online - the manuals arrive as PDF email attachments and then vanish. This catalogue records the wiring and register maps so the next person does not have to reverse-engineer them.

  Family conventions that hold across the range:
  - Brown = V+ (typically 4.5-30V DC), Black = GND.
  - RS485 A+/B- colours are NOT consistent between models. The LEAF-TH uses YELLOW for A+ and BLUE for B-, which is different from most of the others. Meter the pair before you trust the colour.
  - Factory default is usually 4800 baud 8-N-1, slave address 1.
  - Manuals list function code 0x30 in the register table but every worked example frame uses 0x03, so use `register_type: holding`. Fall back to `register_type: read` if you get timeouts.
  - Calibration offsets live in the sensor's own holding registers and persist across power cycles - expose them as ESPHome `number` entities and you can trim a probe from Home Assistant without reflashing.

  STATUS: register map unverified. If you own one and confirm the map, please open a PR - this is exactly the kind of entry the catalogue exists to fix.
drivers:
  - name: ESPHome modbus_controller
    url: https://esphome.io/components/sensor/modbus_controller.html
    kind: esphome-core
platforms:
  - ESPHome
  - Home Assistant
  - Modbus master
works_with:
