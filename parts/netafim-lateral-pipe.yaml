evidence: The lateral run feeding every dripper zone in this fleet. Priced per 200 m roll on the receipt,
  which works out around NZ$0.91 per metre.
failure_modes:
- White pipe is chosen to keep root-zone water cooler and to make algae visible; black pipe in a lit room
  heats the first shot noticeably.
- Kinks at tight radii and the kink never fully recovers - it becomes a permanent flow restriction you
  will not find without a pressure gauge.
- Barbs tear out of warm, soft pipe if the line is pressurised before the clips are on.
- UV degrades LDPE over years; under direct high-intensity LED it ages faster than the datasheet's outdoor
  figure suggests.
notes: Priced per roll, not per metre - see `unit`. The commodity fittings that go with it (barbed elbows,
  tees, ratchet clips, threaded tees, end caps) are all in the NZ$0.30-$4 range and are not catalogued
  individually; buy them as a kit with the roll. Warm the pipe end in hot water before pushing on a barb
  in winter.
