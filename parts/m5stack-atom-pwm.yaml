  note: The base accepts 12-24 V DC and M5Stack rates its switched output to 100 W maximum. GPIO22 drives the onboard PWM stage.
price:
  band: $$
vendors: []
ip_rating: none
calibration_required: none
quality_tier: works
deployment_count: 1
deployment_evidence:
- pwm_led_lights.yaml
evidence: One HAGR ESPHome config drives the Atom PWM on GPIO22 at 1 kHz and exposes it as a monochromatic Home Assistant light. M5Stack documentation identifies the current product as Atom PWM K065 and confirms the GPIO22 pin map, 12-24 V input and 100 W MOSFET output.
failure_modes:
- This is a low-side DC MOSFET driver, not an isolated 0-10 V lighting interface. Do not connect it to an unknown dimming pair until the driver manual confirms PWM or contact-closure compatibility and a safe common reference.
- The 100 W rating is for a DC load under suitable thermal conditions. It is not permission to switch a grow light's mains input or full LED-driver output.
- A shared ground can import noise or fault voltage from a lighting driver into the ESP32. Use an opto-isolated interface when the driver's dimming input is not explicitly SELV and common-ground safe.
- PWM polarity differs between drivers. An inverted output can make 0 percent command full brightness; verify the off state before connecting the crop light.
- WiFi loss must not leave a light at an unsafe state. Pair the dimming channel with a hard photoperiod cutoff or contactor that does not depend on this node.
notes: Use this only on the low-voltage control side of a compatible driver. The HAGR example uses ESPHome LEDC at 1 kHz with inverted output. Confirm frequency, polarity and electrical interface against the exact lighting-driver datasheet before copying it.
