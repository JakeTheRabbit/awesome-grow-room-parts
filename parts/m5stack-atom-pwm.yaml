example:
  lang: yaml
  title: Atom PWM exposed as a Home Assistant light
  source: distilled from HAGR esphome/pwm_led_lights.yaml
  code: |
    output:
      - platform: ledc
        pin: GPIO22
        frequency: 1000 Hz
        id: grow_light_pwm
        inverted: true  # verify this against the exact driver before use

    light:
      - platform: monochromatic
        name: "Grow light PWM"
        output: grow_light_pwm
        gamma_correct: 1.0
