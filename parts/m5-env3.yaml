# yaml-language-server: $schema=../schema/part.schema.json
id: m5-env3
name: M5Stack ENV III Unit (SHT30 + QMP6988)
manufacturer: M5Stack
part_numbers:
  - U001-C
  - ENV III
category: Air quality & CO2
subcategory: Temperature / humidity / pressure
bus:
  - I2C
  - Grove
i2c:
  address: "0x44"
  alternates:
    - "0x45"
  also_occupies:
    - "0x70"
  configurable: true
  how_to_change: |-
    Two chips, two addresses. The SHT30 half moves 0x44 -> 0x45 by pulling ADDR high. The QMP6988
    half sits at 0x70 and can move to 0x56. 0x70 is also the TCA9548A default, so adding a
    multiplexer later collides with this module unless you move one of them first.
voltage:
  nominal: 5
  min: 3.3
  max: 5
  logic: 3.3
price:
  band: $
  observed: 18.0
  source: estimate
  currency: NZD
  observed_date: "2026-03-01"
