  - espoe-multiplexer-irrigation-relays.yaml
  - room-2-scd41-env3-dlight-poe.yaml
  - room-3-scd41-top.yaml
evidence: |-
  The standard climate pairing here: an SCD41 for CO2 plus an ENV III for the temperature and humidity that actually drive VPD, because the SCD41's own T/RH self-heats. Four deployments.
failure_modes:
  - QMP6988 defaults to 0x70, the same address as the TCA9548A mux. Add a mux to an existing ENV III node and the bus goes strange - move one of them.
  - "The Grove cable is the weak point: >1m runs at 100kHz get flaky. Drop to 50kHz."
  - Not condensing-rated. In a drying room at high RH the SHT30 will read 100% and stay there until it dries out.
