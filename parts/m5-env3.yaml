    url: https://shop.m5stack.com/products/env-iii-unit-with-temperature-humidity-air-pressure-sensor-sht30-qmp6988
    part_number: U001-C
    region: Global
ip_rating: none
calibration_required: factory
quality_tier: field-proven
deployment_count: 4
deployment_evidence:
