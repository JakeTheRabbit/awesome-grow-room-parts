example:
  lang: yaml
  title: ENV III - SHT30 + QMP6988 on one Grove port
  source: distilled from common/sensors/sht3x.yaml (scrubbed)
  code: |-
    sensor:
      - platform: sht3xd
        address: 0x44
        update_interval: 30s
        heater_enabled: false
        temperature:
          name: Room Temperature
          filters:
            - lambda: |-
                if (-40.0 <= x && x <= 100.0) return x;
                else return {};
        humidity:
          name: Room Humidity
          filters:
            - lambda: |-
                if (0.0 <= x && x <= 100.0) return x;
                else return {};

      - platform: qmp6988
        address: 0x70          # NOTE: same default as a TCA9548A mux - move one if you use both
        update_interval: 30s
        temperature:
          name: ENV III Temperature
          internal: true
        pressure:
          name: Barometric Pressure
