evidence: Every 24 VAC valve node in this fleet needs one. Counted against the configs that drive 24 VAC
  solenoids, since the transformer is the part that makes those work - it does not appear in the YAML
  itself, being upstream of the controller.
failure_modes:
- Undersized VA and the valves chatter instead of pulling in - size for INRUSH across every valve that
  can open together, not steady-state hold.
- It is a mains part. It belongs in an enclosure, on its own protected circuit, wired by someone qualified
  to do so.
- Runs warm continuously; in a sealed control box that heat has to go somewhere.
- No isolation between output legs on cheap units - do not assume the 24 VAC common is at earth potential.
notes: 'Keeping valve power at 24 VAC is the single best decision in an irrigation control box: it keeps
  mains out of the low-voltage enclosure entirely, so a wet fitting near the controller is a nuisance
  rather than a hazard. Size at roughly 3x the steady-state draw of the valves you can open simultaneously.'
