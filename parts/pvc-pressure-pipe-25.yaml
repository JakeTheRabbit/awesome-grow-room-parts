evidence: The rigid distribution backbone from pump to zone valves in this fleet. PVC on the pressurised
  mains side, LDPE lateral downstream of the valves.
failure_modes:
- Solvent-weld joints made in the cold or on a damp pipe fail weeks later, not immediately - which is
  the worst possible timing.
- PN12 is comfortable for mains but the FITTINGS are usually the weak point; a pipe rated 12 bar on a
  6 bar fitting is a 6 bar system.
- Goes brittle under sustained UV / high-intensity LED - sleeve or paint any exposed run.
- Rigid pipe transmits pump vibration into the building; use a flexible section at the pump.
notes: Sold in 5.8 m lengths and often bundled - check whether a quoted price is per length or per bundle
  before budgeting. Commodity PVC fittings (elbows, tees, unions, valve sockets, end caps, clips) run
  NZ$0.79-$8 each and are not catalogued individually.
