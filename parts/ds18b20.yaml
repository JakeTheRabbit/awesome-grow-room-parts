id: ds18b20
name: DS18B20 1-Wire temperature probe
manufacturer: Analog Devices / Maxim
part_numbers:
- DS18B20
- DS18B20+
- DS18B20 waterproof probe
category: Water & fertigation
subcategory: Digital temperature probe, stainless sheath
bus:
- 1-Wire
protocol_settings: 1-Wire, each device has a unique 64-bit ROM address. 4.7k pull-up to 3V3 on the data
  line.
voltage:
  min: 3.0
  max: 5.5
  nominal: 3.3
  logic: 3.3
  note: Use normal power, not parasite power - parasite mode is a common source of flaky reads.
price:
  band: $
  observed: 9.0
  source: estimate
  currency: NZD
  observed_date: '2026-03-01'
  note: Waterproof stainless probe on a 1-3 m lead.
vendors:
- name: Adafruit waterproof DS18B20
  url: https://www.adafruit.com/product/381
  part_number: '381'
ip_rating: IP67
calibration_required: factory
calibration_notes: Factory accuracy +/-0.5 C over -10 to +85 C. Good enough for tank and root-zone water
  without user calibration.
quality_tier: works
deployment_count: 0
deployment_evidence: []
evidence: No active dallas/one_wire block in the current fleet - reservoir temperature is read off the
  Atlas RTD and the substrate probes instead. Included because it is the cheapest reliable way to get
  water temperature and it is what most growers will reach for first.
failure_modes:
- Counterfeit DS18B20s are everywhere and are genuinely bad - wrong resolution, +/-2 C errors, and they
  drop off the bus intermittently. Buy from a real distributor.
- Parasite power looks like it works then fails under load; run a proper 3-wire connection.
- Long leads without the 4.7k pull-up (or with it at the wrong end) give intermittent CRC errors that
  look like a dying probe.
- The stainless sheath is earthed in some probes - dropping one into a tank with a stray-voltage problem
  can inject noise into your EC reading.
notes: Rock solid when genuine and wired properly. Many probes can share one GPIO since each has a unique
  ROM address, which makes it cheap to instrument several tanks at once. In ESPHome 2025.x+ the component
  is `one_wire` + `dallas_temp`, not the old `dallas`.
drivers:
- name: ESPHome dallas_temp
  url: https://esphome.io/components/sensor/dallas_temp.html
  kind: esphome-core
- name: DS18B20 datasheet
  url: https://www.analog.com/en/products/ds18b20.html
  kind: datasheet
platforms:
- ESPHome
- Home Assistant
- Arduino
- MicroPython
- Raspberry Pi
works_with:
- m5stack-poesp32
- m5stack-atom-lite
alternatives:
- atlas-ezo-rtd
use_cases:
- reservoir water temperature
- "root-zone water temperature"
image: assets/parts/ds18b20.png
image_source_url: https://www.adafruit.com/product/381
image_source: vendor
example:
  lang: yaml
  title: DS18B20 water temperature (modern one_wire component)
  source: reference config - ESPHome 2025.x syntax
  code: |
    # NOTE: the old `platform: dallas` was removed in ESPHome 2025.x.
    # Use the one_wire bus + dallas_temp sensor instead.
    one_wire:
      - platform: gpio
        pin: GPIO32          # needs a 4.7k pull-up to 3V3

    sensor:
      - platform: dallas_temp
        # Find the address in the logs on first boot, then pin it here so a
        # second probe on the bus cannot silently swap identities.
        address: 0x0000000000000000
        name: "Reservoir temperature"
        resolution: 12
        update_interval: 30s
tags:
- temperature
- 1-wire
- water
- reservoir
