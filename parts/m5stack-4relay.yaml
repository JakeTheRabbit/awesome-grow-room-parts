evidence: 18 production configs drive an active m5stack4relay block - irrigation solenoids, ceiling vents,
  dehumidifiers, CO2 and dry-room relays. This is the workhorse output device of the facility and it is the
  part most tightly bound to the SAFETY pattern.
failure_modes:
- Relay channel numbering is REVERSED relative to the silkscreen in the ESPHome external component - relay4
  is physical relay 1. Get this wrong and you open the wrong valve.
- Default restore_mode restores the last state on boot; after a power cut that can silently re-open an
  irrigation valve. Always force ALWAYS_OFF.
- Contacts weld closed under repeated inductive switching (solenoids, contactors) - fit a snubber or drive
  a proper contactor instead of the load directly.
- Needs an external component - it is not in ESPHome core.
notes: 'Anything on this module that can move water or gas MUST carry the three-part safety pattern: restore_mode
  ALWAYS_OFF, an on_turn_on auto-shutoff delay, and a network killguard. See SAFETY.md - that pattern
  is the single highest-value thing in this repo.'
drivers:
- name: KoenBreeman ESPHome_custom_components (m5stack4relay)
  url: https://github.com/KoenBreeman/ESPHome_custom_components/
  kind: esphome-external
platforms:
