evidence: In service on the main distribution board here, but it is a commercial device with its own firmware
  rather than an ESPHome node, so it has no device config to count. Tiered on operating experience, not
  on config-file evidence.
failure_modes:
- CT clamps are directional - fitted backwards a phase reads negative, which looks like export rather
  than an install error.
- 'Sized clamps: a 120 A CT on a 16 A circuit wastes most of its resolution and small loads disappear
  into the noise.'
- It is a DIN-rail mains device. Installation is an electrician's job in most jurisdictions.
- WiFi in a metal distribution board is usually poor - use the wired variant or an external antenna.
notes: Per-phase power is the cheapest way to catch a failing compressor, a dehumidifier stuck on, or
  a lighting contactor that did not drop out - all of which show up in the load curve well before anything
  else notices. Phase balance also matters on 3-phase supply, and this is the only thing that will tell
  you about it.
