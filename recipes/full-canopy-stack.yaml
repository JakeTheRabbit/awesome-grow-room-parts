id: full-canopy-stack
name: Full canopy stack — light, thermal, CO2, T/RH and substrate
summary: >-
  Everything needed to steer a room properly: canopy climate and CO2, real leaf
  temperature from a thermal array rather than an air proxy, light as PPFD and
  DLI, and substrate VWC and pore-water EC. This is the combination that makes
  leaf VPD and dryback tracking possible at the same time, which is what the
  commercial platforms are actually selling.
skill_level: advanced
estimated_build_time: a day per room, plus calibration
network: Wired Ethernet (PoE) for the climate and thermal nodes
items:
  - part: m5stack-poesp32
    qty: 2
    role: One host for the climate node, one for the thermal camera.
  - part: sensirion-scd41
    qty: 1
    role: CO2 for injection control and ventilation interlock.
  - part: m5-env3
    qty: 1
    role: Published temperature and humidity, plus pressure compensation for the SCD41.
  - part: bh1750
    qty: 1
    role: Light level, calibrated to PPFD and integrated to DLI.
  - part: mlx90640-thermal
    qty: 1
    role: Canopy leaf temperature. The reason this stack beats an air-VPD-only build.
  - part: m5stack-atom-lite
    qty: 1
    role: SDI-12 host for the substrate probes.
  - part: meter-teros12
    qty: 2
    role: Substrate VWC, pore-water EC and root-zone temperature.
notes: >-
  Why leaf temperature changes the picture: air VPD tells you what the air is
  doing, leaf VPD tells you what the plant is doing, and under high-intensity
  LEDs those two numbers diverge - leaf can sit below air temperature under
  transpiration, or above it when stomata close. Steering on air VPD alone
  means steering on a proxy. The MLX90640 gives a real leaf surface
  temperature, and combined with the ENV.III T/RH you get leaf VPD rather than
  air VPD. The substrate probes then close the loop: leaf VPD tells you what
  the plant wants to transpire, dryback tells you whether it can.
watch_out: >-
  Set MLX90640 emissivity to 0.95 for foliage. Leaving it at the 1.0 default
  under-reads leaf temperature by several degrees, and every leaf-VPD number
  downstream inherits that error silently. Use a region of interest over the
  canopy rather than the frame average, or a hot LED driver in shot drags the
  whole number. Run the thermal camera's I2C bus at 400kHz - 100kHz cannot
  sustain a 768-pixel frame and you get torn frames that look like sensor
  noise. On the substrate side, raw SDI-12 counts are not VWC: the conversion
  polynomial is media-specific and the coco curve is wrong for rockwool.
  Calibrate against gravimetric samples from your own substrate before steering
  anything on those numbers.
example:
  lang: yaml
  title: MLX90640 tuned for leaf temperature, with leaf VPD from the same node
  source: distilled from a production thermal node (credentials scrubbed)
  code: |
    external_components:
      - source:
          type: git
          url: https://codeberg.org/stackdrift/esphome-components
          ref: main
          path: "."
        components: [mlx90640]

    i2c:
      sda: GPIO16
      scl: GPIO17
      frequency: 400kHz     # 100kHz cannot sustain a 768-pixel frame
      scan: true

    # The component DEPENDS on these platforms, so they must exist even empty.
    number:
    select:

    mlx90640:
      id: thermal_cam
      address: 0x33
      refresh_rate: "16Hz"
      resolution: "18-bit"
      pattern: "chess"
      update_interval: 20000            # ms

      emissivity: 0.95                  # foliage. NOT the 1.0 default.
      ta_shift: 8.0                     # reflected temp = ambient - 8C

      # Central canopy patch, not the whole frame - otherwise a hot driver
      # in shot drags the average and you steer on the luminaire.
      roi:
        enabled: true
        center_row: 12
        center_col: 16
        size: 5                         # size N -> (2N+1) square

      temperature_sensors:
        roi_avg:
          name: "Leaf Temperature"
          id: leaf_temperature
          filters:
            - median: { window_size: 5, send_every: 1, send_first_at: 1 }
        roi_min: { name: "Leaf Temperature Min" }
        roi_max: { name: "Leaf Temperature Max" }
        avg:     { name: "Canopy Average Temperature" }
        max:     { name: "Canopy Max Temperature" }

    sensor:
      # Leaf VPD: saturation vapour pressure at LEAF temperature against the
      # actual vapour pressure of the air. This is the number worth steering on.
      # Air temperature and RH are imported from the climate node.
      - platform: homeassistant
        id: air_temp
        entity_id: sensor.canopy_node_temperature
        internal: true
      - platform: homeassistant
        id: air_rh
        entity_id: sensor.canopy_node_humidity
        internal: true

      - platform: template
        name: "Leaf VPD"
        state_class: measurement
        unit_of_measurement: "kPa"
        accuracy_decimals: 2
        lambda: |-
          float tl = id(leaf_temperature).state;   // leaf surface
          float ta = id(air_temp).state;           // air
          float rh = id(air_rh).state;
          if (isnan(tl) || isnan(ta) || isnan(rh)) return NAN;
          // SVP at the leaf, actual VP from the air.
          float svp_leaf = 0.61078 * exp((17.27 * tl) / (tl + 237.3));
          float svp_air  = 0.61078 * exp((17.27 * ta) / (ta + 237.3));
          float vp_air   = svp_air * (rh / 100.0);
          float vpd = svp_leaf - vp_air;
          return vpd < 0 ? 0 : vpd;
