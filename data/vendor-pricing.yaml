# Proprietary grow-platform pricing, for the DIY vs buy comparison page.
#
# Every figure here carries the confidence tag and source it came from, and the
# page renders both. Nothing is estimated, interpolated or inferred from
# "typical market pricing" - where a number is not obtainable, that is recorded
# as a finding rather than filled in.
#
# Tags, carried through from the source research:
#   a  vendor-published (own site, docs, contract or product feed)
#   b  reseller / distributor listing
#   c  user-reported (forum, Reddit, or trade press quoting a named customer)
#   d  NOT publicly available - quote-only, or searched for and not found
#
# Confidence is separate from tag. A vendor-published figure can still be
# MEDIUM if it is a modelling default rather than a price list - see the AROYA
# hardware anchors, which are explicitly weaker than the subscription tiers.

meta:
  research_date: "2026-08-02"
  currency: USD
  note: >-
    All vendor figures USD. DIY figures are derived from this repository's own
    build recipes, which are priced in NZD and converted using data/fx.yaml.
  methodology: >-
    Vendor build totals are arithmetic on tagged list prices, not vendor quotes.
    They exclude tax, shipping, electrical work and, except where stated,
    installation. These systems are also not functionally identical: a $925
    environment controller and a $47,200 substrate-analytics platform with human
    agronomy coaching are not the same purchase. The tables compare cost. The
    honest-limits section compares capability.

# ---------------------------------------------------------------------------
vendors:
  - id: trolmaster
    name: TrolMaster
    positioning: Environment control. Dominant at small and mid indoor scale.
    subscription_model: >-
      App is free with no paid remote tier. API access is billed separately at
      $15 per month per device.
    recurring_note: >-
      "No subscription" is true for using it. The moment you want programmatic
      access to your own data it is $15 per device per month, indefinitely. At
      20 devices that is $3,600/yr - the same order as AROYA's mid tiers.
    stops_paying_answer: >-
      ANSWERED. Local control at the controller face is free and always
      available, with local CSV logging to MicroSD. Confirmed surviving a cloud
      outage. The catch is that alerts die with the cloud.
    stops_paying_confidence: HIGH
    stops_paying_tag: a
    four_room:
      hardware: 6391
      recurring_per_year: 0
      recurring_alt: 720
      recurring_alt_label: if API enabled on 4 controllers
      tag: b
      confidence: HIGH
      source: https://www.hydrobuilder.com/
      source_label: Hydrobuilder / Forever Green retail listings
    single_room:
      hardware: 925
      recurring_per_year: 0
      tag: b
      confidence: HIGH
      source: https://www.hydrobuilder.com/
      source_label: Hydrobuilder retail listing
    citations:
      - label: "API Gateway: \"a subscription fee of $15 per month per device\""
        url: https://www.trolmaster.com/News/ApiGateway
