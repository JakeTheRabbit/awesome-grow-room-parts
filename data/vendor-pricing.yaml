# ---------------------------------------------------------------------------
# Vendors where pricing could not be obtained. Recording this is a finding,
# not a gap - "not published anywhere, including through distributors" is
# itself decision-relevant information.
not_obtainable:
  - name: Priva
    finding: >-
      No pricing published anywhere, including on authorised reseller
      storefronts, which list products at zero with a "View Product Details"
      prompt. US procurement and grant-budget searches turned up no disclosed
      contract values. API access additionally requires a Priva Gateway and a
      Priva Connected subscription, whose price is also unpublished.
    relevance: >-
      Enterprise glass horticulture. A small indoor operator would not reach
      the quote stage economically.
    tag: d
    url: https://www.priva.com/

  - name: iUNU
    finding: >-
      No pricing published; everything routes to a demo booking or a gated
      form. Sold as system-as-a-service on 3-5 year SLAs with vendor-financed
      hardware, priced by camera passes per day.
    relevance: >-
      Has exited cannabis as a go-to-market. The "Crops Grown" field on iUNU's
      own contact form offers tomatoes, cucumbers, peppers, berries, leafy
      greens, ornamentals and other - cannabis is not an option (fetched
      August 2026). The product is also camera-on-rail for tall vine crops in
      glass, which is a poor structural fit for racked indoor rooms.
    tag: d
    url: https://iunu.com/

# ---------------------------------------------------------------------------
# Costs that are real, material, and that no vendor publishes. Every one is (d).
hidden_costs:
  - item: Sensor replacement
    detail: >-
      TrolMaster warrants products for 3 years but sensor probes for 1 year,
      against a consistent body of user reports of drift and failure around the
      two-year mark. CO2 sensors run $187-243 each and substrate probes
      $200-309. No vendor publishes a failure rate.
  - item: Renewal increases
    detail: >-
      AROYA's contract grants repricing at the "then going rate" with 30 days'
      notice and no cap. Growlink auto-renews at the "then-current standard
      rate", also uncapped, and has moved price three times in 30 months. No
      user has publicly reported an actual renewal invoice.
  - item: Installation and commissioning
    detail: >-
      AROYA's calculator carries $3,000-$20,000 implementation. Growlink does
      not publish it, though one user reports approximately $15,000 install on
      a $60,000 hardware order. Argus require the customer to supply the
      installation crew.
  - item: Calibration labour
    detail: >-
      TEROS 12 is factory-calibrated and cannot be field-recalibrated - drift
      means RMA or replacement. TrolMaster substrate sensors need user-defined
      calibration to your specific media, reported drifting by 10-20% every few
      days. Pulse CO2 needs manual outdoor recalibration every 4-6 months and
      pH probes are a $99 consumable. None of this is a line item anywhere.
  - item: The audit sensor
    detail: >-
      Multiple experienced operators run a second trusted sensor purely to
      check the first. That is a real recurring cost of a system you do not
      fully trust, and it appears in no budget.
  - item: Exit cost
    detail: >-
      AROYA deletes data 90 days after termination and one 90,000 sq ft
      operator describes his exit as "a very long and difficult exit".
      Growlink's Terms carry no export obligation, and the manual CSV is a 20x
      downsample of what you paid to collect.

# ---------------------------------------------------------------------------
# Reproduced from the source research, section 9.3, deliberately unsoftened.
# A reader should be able to finish this section and reasonably decide to buy.
# That is the point of including it.
case_against_diy:
  preamble: >-
    This section is deliberately unflattering to DIY. Someone should be able to
    read it and reasonably choose to buy. If the rest of this page is going to
    be credible about vendor costs, it has to be equally honest about what you
    give up by not paying them.
  points:
    - title: No support contract, and support is real value
      detail: >-
        Multiple independent first-hand reports value it highly: "their
        training, tech support, and software for the normal subscription is
        second to none. spend a year training, and in tech support with them
        twice a month, and you will benefit massively" (AROYA customer).
        "Their customer support team is incredible" (Growlink). At 3am with a
        room at 100% RH, there is nobody to call on a DIY rig.
    - title: No warranty, no RMA, no advance replacement
      detail: >-
        Growlink CORE includes 3-year advance replacement. TrolMaster warrants
        products 3 years. AROYA replaced a foliar-killed TEROS under warranty.
        Your DIY board dies and you buy another one and you rebuild it.
    - title: You are the integrator, and integration is where projects die
      detail: >-
        A Home Assistant SDI-12 thread runs to 26 posts over months:
        temperature-dependent moisture readings, the TEROS 12 soilless-media
        calibration polynomial topping out around 80% instead of 100%,
        unique-ID entity errors, serial parsing bugs. One participant: "the
        readings that get displayed don't match the readings from the little
        USB dongle thingy that you use with the Aroya app. So I reworked the
        equations and now I have a home brewed Aroya system." The calibration
        polynomial is a real hidden DIY cost.
    - title: Calibration is entirely on you, and it is harder than it looks
      detail: >-
        TEROS 12 is factory-calibrated for a reason. AROYA's own white paper
        reportedly concedes the TEROS 12 "wasn't accurate at high EC". Deriving
        your own media-specific VWC and EC transfer functions is a genuine
        soil-physics problem, not a coding problem.
    - title: There is no mature open-source alternative, only many small immature ones
      detail: >-
        As of August 2026 the leading crop-steering projects carry single and
        low-double-digit star counts. The leading project's maintainer posted
        in July 2026 describing "a serious silent failure: on some installs the
        engine couldn't find the zone moisture probes at all, so the zones
        froze... and watering fell back to a dumb timer." A user later the same
        month: "I can't get it to work... I've uninstalled everything. Too bad."
    - title: No compliance or audit trail
      detail: >-
        AROYA at $300/month reportedly includes METRC integration and the full
        platform. Argus Titan Enterprise at $28,000 buys multi-user, audit
        tracking and password control - explicitly a compliance product. A DIY
        stack gives you none of this, and in a licensed operation seed-to-sale
        integration and audit logging are not optional.
    - title: Silent failure risk is asymmetric
      detail: >-
        Growlink had an app bug that "will run your reservoir completely
        empty... and flood your tables" - but that was one company's bug,
        reported publicly, in a product with a support line. A DIY silent
        failure is yours alone to find, usually after the crop.
    - title: Key-person risk
      detail: >-
        A DIY system encodes its logic in one person's head. Commercial systems
        are documented, transferable, and survive that person leaving. Argus's
        "no user configuration or programming is required" is lock-in. It is
        also continuity.
    - title: Even DIY partisans concede the effort
      detail: >-
        An operator running Home Assistant with METER and Apogee sensors
        commercially: "No subscription cost, but a lot of coding and
        maintenance." And on the other side: "home assistant is way more effort
        than trolmaster and every update seems to break something."
    - title: The engineering gap is real
      detail: >-
        The fairest framing found in the research: "Are you going to design all
        the sensor front ends... Are you familiar with maintaining resolution of
        different bit depths of analog to digital converters? Are you going to
        design a PCB so its actually professional?" The conclusion drawn there:
        for microgrowers, off-the-shelf at $250-500 wins; for large operations,
        $4k software would be a no-brainer if it works.

# The pattern the research found most often among sophisticated operators.
middle_path:
  headline: Buy the sensors, refuse the platform
  detail: >-
    The most consistent pattern across the user research is neither pure DIY
    nor pure platform. Operators at 30,000 and 90,000 sq ft run METER sensors
    into a PLC or pair AROYA with OpenSprinkler; others run METER sensors into
    ZENTRA Cloud at $180/yr instead of AROYA, or import Pulse data into Home
    Assistant over the documented API and write their own crop-steering logic.
    Pulse Grow is the natural bridge - documented self-service API, TEROS 12
    retrofit kits at $39-69, and a working free tier.

# ---------------------------------------------------------------------------
# Operator recommendations. This is a DIFFERENT class of evidence from
# everything above: first-hand experience running this kit in production,
# not vendor-published pricing or third-party reports. It is opinion, it is
# labelled as opinion on the page, and it is kept separate so that it cannot
# be mistaken for the sourced research.
recommendations:
  evidence_class: >-
    First-hand operator experience from running these products in a production
    facility. Not vendor-published, not third-party reported. Treat it as an
    informed opinion from someone with the kit in the ground, and weigh it
    accordingly.
  picks:
    - subject: Grow Sensor
      verdict: Recommended without reservation
      rating: strong
      detail: >-
        Genuinely excellent, and the one commercial product here that earns its
        money outright. It measures the things that are hard to measure well -
        PPFD, spectrum, DLI, leaf temperature and true leaf VPD - and it does it
        as a calibrated instrument rather than a lux sensor with a conversion
        factor bolted on. Getting real leaf VPD without building an MLX90640
        node yourself is the headline: that is the number worth steering on, and
        most builds approximate it from air temperature because the direct
        measurement is awkward.
      why_it_fits: >-
        It integrates into Home Assistant, so it behaves like the rest of a DIY
        stack rather than a walled garden - the data lands next to everything
        else and you can build your own logic on top. There is no subscription
        to use the sensor or the app. Combined with the no-subscription position
        and a two-year warranty, it is the rare case where buying is simply
        better than building: replicating calibrated spectral measurement in DIY
        is genuinely hard, and this removes that problem for the price of a
        mid-range part.
      caveat: >-
        It is still a monitor. It measures the canopy, it does not run the room
        - pair it with a controller. And the forward-looking unknowns stand as
        the vendor states them: premium features "may require a subscription in
        the future", and GrowOps renewal pricing after the bundled first year is
        not published.

    - subject: METER TEROS 12 substrate probes
      verdict: The reference standard, and worth the premium
      rating: strong
      detail: >-
        The AROYA-lineage substrate probes are the best in this catalogue and
        the ones to build around. Running both a TEROS 12 and a lower-cost
        SDI-12 clone in the same room, side by side, the TEROS 12 is clearly the
        better instrument - and substrate data is the one place where sensor
        quality directly changes irrigation decisions rather than just tidying a
        dashboard.
      why_it_fits: >-
        Crucially, buying the good probe does not mean buying the platform. The
        TEROS 12 speaks SDI-12 and DDI, METER explicitly document third-party
        logger use, and it costs a fraction of the AROYA subscription it is
        usually sold alongside. This is the clearest instance of the pattern the
        research found across sophisticated operators: buy the sensors, refuse
        the platform.
      caveat: >-
        Factory calibration is generic. The media-specific conversion still
        matters, and METER's own published figures make the point - plus or
        minus 0.03 m3/m3 on the generic calibration against plus or minus
        0.01-0.02 with a medium-specific one.

    - subject: Lower-cost SDI-12 substrate probes
      verdict: Usable, and clearly second
      rating: qualified
      detail: >-
        The budget SDI-12 probes work and they are a legitimate way to get more
        zones covered for the money. Run against a TEROS 12 in the same
        substrate, they are the weaker instrument. If the budget only stretches
        to good probes in some zones, put the TEROS 12 where the irrigation
        decision is actually made and fill the rest with the cheaper ones.
      caveat: >-
        They need their own media-specific calibration curve, and the raw counts
        are not comparable to a TEROS 12's. Do not mix the two in one averaged
        zone figure.
