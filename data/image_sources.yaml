# Where each part's product image comes from.
#
# Images are DOWNLOADED and self-hosted (see scripts/fetch_images.py), never
# hotlinked - a vendor reorganising their CDN must not break the catalogue.
#
# Preference order:
#   1. the manufacturer's own product page / press kit
#   2. a vendor listing, only where the manufacturer publishes no usable image
#   3. nothing - keep the generated placeholder. A truthful placeholder beats a
#      wrong or misleading picture.
#
# Product images remain the property of their respective manufacturers and are
# used here for identification only. See the licence note in README.md.
#
# Fields per entry:
#   page   - the page to scrape for an image (also recorded as provenance)
#   direct - a direct image URL, when the page scrape picks the wrong thing
#   match  - regex to prefer among the candidates found on the page
#   source - manufacturer | vendor | press-kit | own-photo
#
# BLOCKED SOURCES
# Some manufacturers reject automated requests outright. Verified 2026-08-02:
#   403 bot-protected: hunterirrigation.com, senninger.com, metergroup.com,
#                      melexis.com, shelly.com
#   404/500 on the URLs tried: bosch-sensortec.com, netafim.com, amiad.com,
#                      growlink.com, kincony.com, wiznet.io
# Adding a Referer and a browser User-Agent does NOT get past the first group -
# they fingerprint the client, not the headers.
#
# The route that does work: open the product page in a real browser, fetch the
# image from within the page context (same-origin, so it is permitted), read it
# back as a base64 data URL and write it out at the two sizes. That is manual
# per image, which is why these entries still show placeholders rather than
# being quietly filled with something approximate.

